  # -- Power row --
  - claim: SUPERMILL TWO-scale plant requires <4 MW
    provenance: asserted-internal
    conf: M-H
    source: Alex Lau, 2026-08-23; independently consistent with FEL2 basis (~900-930 kWh/t x ~30K t/yr = ~27 GWh/yr = ~3.2 MW average draw)
    slide: Economics
    note: TEM-vs-FEL2 energy reconciliation still open in mills repo, but Alex's figure matches the FEL2 arithmetic.
  - claim: Minimill ~150 MW class (EAF melt 350-500 kWh/t at ~3M t/yr)
    provenance: derived
    conf: M
    source: melt intensity published [H]; site average derived - melt only, so understates minimill power (conservative direction for our contrast)
    slide: Economics
  - claim: Smelter >1 GW continuous
    provenance: published
    conf: H
    source: Canary Media 2026 (Inola)
    slide: Economics

  # -- Volume output row (m3/yr) --
  - claim: SUPERMILL ~24,000 m3/yr (36M sf at 7.2mm average board thickness)
    provenance: derived
    conf: M
    source: 36M sf/yr internal capacity [M] x 7.2mm conversion (parent register) = 24,080 m3
    slide: Economics
  - claim: Minimill ~347,000 m3/yr (~3M short tons at 7.85 t/m3)
    provenance: derived
    conf: H
    source: 3.0 Mtpa published [H] x 0.907 mt/st / 7.85 t/m3 (parent register conversion)
    slide: Economics
  - claim: Smelter ~278,000 m3/yr (750K t at 2.70 t/m3)
    provenance: derived
    conf: H
    source: 750K t/yr published [H] / 2.70 t/m3 standard aluminum density
    slide: Economics

  # -- Cost to build row --
  - claim: SUPERMILL capex $300M
    provenance: internal
    conf: H (internal canonical)
    source: deck-canonical per Alex 2026-08-23 (investor-overview register)
    slide: Economics
  - claim: Minimill capex $1.9B (SDI Sinton) to $4.0B (Nucor Apple Grove board-approved Feb 2025)
    provenance: published
    conf: H
    source: SDI PR 2019 / BuildSteel (Sinton $1.9B, 3.0 Mtpa); Nucor updates (Apple Grove $2.7B -> ~$4.0B)
    slide: Economics
  - claim: Smelter capex ~$4B (Century/EGA Inola)
    provenance: published
    conf: H
    source: Canary Media / Oklahoma Energy Today 2026
    slide: Economics

  # -- Profit per year row --
  - claim: SUPERMILL ~$208M/yr plant EBITDA (65% of $320M projected)
    provenance: derived (internal inputs)
    conf: M
    source: arithmetic on deck-canonical figures; projection, not actuals
    slide: Economics
  - claim: Minimill ~$0.6-1.2B/yr EBITDA over the cycle (SDI $197/t 2024 to $411/t 2021, x 3M t)
    provenance: derived
    conf: M
    source: SDI company-wide per-ton EBITDA published [H/M] applied to a single 3 Mtpa plant
    note: Company-wide margin used as plant proxy - flag if challenged.
    slide: Economics
  - claim: Smelter ~$340M/yr at record 2025 margins (~17%), cyclical
    provenance: estimated
