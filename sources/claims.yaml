  - claim: ~60% of a US data center is steel; operators concerned about structural steel shortage
    provenance: inherited / asserted-internal
    conf: L
    source: ../../investor-overview/sources/claims.yaml (registered there as unverified, conf L, NEEDS SOURCE)
    slide: The Gap
    basis: >-
      Alex 2026-08-27: the 60% denominator is the BUILDING AND ITS CONTENTS EXCLUDING
