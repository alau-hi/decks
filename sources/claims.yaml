      "NEEDS SOURCE - load-bearing for the entire data-center appendix" and was inherited
      here without ever being sourced. On Alex's ex-concrete basis the review's objection
      does not apply.
      NO PUBLISHED SOURCE STATES A STEEL SHARE ON ANY BASIS. Searched 2026-08-27: LCA
      literature, Schneider Electric Scope 3 white paper (carbon only, no mass inventory),
      Gensler Research Institute 2023 (carbon only), Vertiv modular white paper (gated,
      no quantities on the public page), WEF Dec 2025 (403). What does exist, per MW:
      structural steel 500-1,000 t per 10 MW facility and concrete 5,000-10,000 m3 per
