claims:
  - claim: ~1 in 5 tons of US finished steel is imported (18% of apparent consumption in 2025; 23% in 2024)
    provenance: published
    source: American Iron and Steel Institute, "Steel Imports Down 12.6% in 2025" (Feb 2026)
    url: https://www.steel.org/2026/02/steel-imports-down-12-6-in-2025/
    slide: The Gap
    note: >-
      2025 share fell from 23% under Section 232 tariffs (25% from Mar 2025, 50% from
      Jun 2025). Printed as 20% from 2026-08-27 (Alex's rounding of the 2024-25 pair),
      then REVERTED TO THE SOURCED 18% on 2026-08-29 at Alex's direction. 18% is AISI's
      2025 figure; 23% was 2024. Corroborated independently by USGS MCS 2026: 19 Mt of
      finished steel imports against 95 Mt apparent consumption (2025e) = 20.0% - the
      two agree to within rounding on different denominators.

  # -- Aluminum import share. CORRECTED 2026-08-26 after Alex flagged the 85% as a
  #    misread. It was: the Aluminum Association's "~85%" is the RECYCLED share of
  #    US-made aluminum, not an import share. Both readings are researched below;
  #    only the primary-aluminum one is printed. --
  - claim: ~85% of the primary (unwrought) aluminum the US uses is imported
    provenance: derived from published
    conf: H
    source: >-
      The Aluminum Association / Wittsend, "Powering Up American Aluminum" white paper
      (May 2025), pp. 3: "aggregate U.S. primary aluminum demand will rise from 4.4 to
      5.1 million metric tons by 2029" and "Today, the U.S. has four aluminum smelters
      remaining, producing 683,500 metric tons." 4.4 Mt demand less 0.6835 Mt domestic
      primary = 3.72 Mt imported = 84.5%.
    url: https://www.aluminum.org/sites/default/files/2025-05/PoweringUpAluminum_WhitePaper_2025.pdf
    local: sources/PoweringUpAluminum_WhitePaper_2025.pdf
    corroboration: >-
      USGS MCS 2026 puts US primary production at 660 kt (2025e) against 4,400 kt of
      crude-and-semifabricated imports. The same white paper states the import gap as
      "around 4 million metric tons of raw (or unwrought) aluminum," which on the same
      4.4 Mt denominator reads ~90%. The honest band is 85-90%; ~85% is the conservative
      end and is what prints.
    slide: The Gap
    note: >-
      MUST be labeled "primary" (or "new") aluminum. Applied to all aluminum it is wrong
      by a wide margin - see the next entry. Resolves the open question logged in
      ../../investor-overview (2026-08-24): the 85% Alex supplied is real and it is the
      primary-aluminum share, not bauxite/alumina.

  - claim: US net import reliance for aluminum (all forms) is 60% of apparent consumption
    provenance: published
    conf: H
    source: >-
      USGS Mineral Commodity Summaries 2026 - Aluminum (Feb 2026): net import reliance
      60% (2025e), 62% (2024), 63% (2023).
    url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-aluminum.pdf
    local: sources/mcs2026-aluminum.pdf
    slide: The Gap (sources panel only)
    note: >-
      Basis change: MCS 2026 stopped netting exported scrap out of the calculation
      (footnote 3), which is why the same 2024 figure reads 62% here and 47% in MCS 2025.
      Quote the MCS 2026 basis and do not mix the two series. This is the figure
      ../../investor-overview prints on its Vs Steel supply row - the two decks are
      consistent because they are measuring different things.

  - claim: NOT AN IMPORT SHARE - the Aluminum Association's "~85%" is the recycled share of US-made aluminum
    provenance: published
    conf: H
    source: >-
      aluminum.org/PowerUp: "recycled or 'secondary' production now accounts for ~85% of
      U.S.-made aluminum"; the white paper phrases it as "over 80% of total raw aluminum
      supply produced in the U.S. today."
    url: https://www.aluminum.org/PowerUp
    slide: none - do not print
    note: >-
      Recorded so the misread cannot recur. Arithmetic check on USGS MCS 2026 (2025e):
      secondary 1,600 + 2,000 = 3,600 kt against 660 kt primary = 84.5% of domestic
      output. The coincidence that the recycled share and the primary-import share are
      both ~85% is what made the original claim look sourced.

  - claim: 4 US primary aluminum smelters operating, down from 33 in 1980
    provenance: published
    conf: H
    source: >-
      Aluminum Association PowerUp white paper (May 2025): "In 1980, the U.S. produced
      over 4.65 million metric tons at 33 sites with a nameplate capacity of 4.8 million
      metric tons... Today, the U.S. has four aluminum smelters remaining, producing
      683,500 metric tons. The primary aluminum segment... is operating at 53% of
      installed capacity."
    url: https://www.aluminum.org/sites/default/files/2025-05/PoweringUpAluminum_WhitePaper_2025.pdf
    local: sources/PoweringUpAluminum_WhitePaper_2025.pdf
    corroboration: >-
      USGS MCS 2026: six smelters exist in five States, of which Hawesville KY (2022) and
      New Madrid MO (2024) are temporarily shut - so four operating, matching the
      Aluminum Association. The White House Section 232 proclamation (Feb 2025) gives 52%
      capacity utilization for 2024 against the Association's 53%.
    slide: The Gap
    note: >-
      The old "one source says five" doubt is resolved: aluminum.org's landing page says
      "24 to 4," counting from a later year than the white paper's 1980 count of 33. Date
      the 33 to 1980 whenever it prints. Mt. Holly SC announced a >50,000 t/yr restart in
      Aug 2025 for mid-2026 - recheck the count of four after mid-2026.

