# Claims register — Super Mills America deck
# New claims introduced by this deck only. Everything else (capex, EBITDA, ROE,
# deposits, pipeline, cost roadmap, properties, feedstock-in-48-states) traces to
# ../../investor-overview/sources/claims.yaml.

claims:
  - claim: ~1 in 5 tons of US finished steel is imported (18% of apparent consumption in 2025; 23% in 2024)
    provenance: published
    source: American Iron and Steel Institute, "Steel Imports Down 12.6% in 2025" (Feb 2026)
    url: https://www.steel.org/2026/02/steel-imports-down-12-6-in-2025/
    slide: The Gap
    note: 2025 share fell from 23% under Section 232 tariffs (25% from Mar 2025, 50% from Jun 2025).

  - claim: ~85% of US industry's aluminum needs are met by imports
    provenance: published
    source: The Aluminum Association, "Powering Up American Aluminum" roadmap (2025)
    url: https://www.aluminum.org/PowerUp
    slide: The Gap

  - claim: 4 US primary aluminum smelters remain operating, down from 33 historically
    provenance: published
    source: The Aluminum Association PowerUp roadmap; DOE announcement
    url: https://www.aluminum.org/PowerUp
    slide: The Gap
    note: One source says five; four is the Aluminum Association figure. Verify before print use.

  - claim: America's first new primary aluminum smelter since 1980 — Century Aluminum / EGA JV, Inola OK; ~$4B; $500M DOE award; >1 GW continuous power; still waiting on a power deal as of 2026
    provenance: published
    source: US DOE (2025); Canary Media (2026)
    url: https://www.energy.gov/articles/energy-department-awardee-build-first-american-aluminum-smelter-1980
    url2: https://www.canarymedia.com/articles/clean-aluminum/americas-new-aluminum-smelter-needs-power
    slide: Old Mills

  - claim: A new US mine averages ~29 years from discovery to production, second-longest in the world
    provenance: published
    source: S&P Global Market Intelligence, "Mine Development Times - The US in Perspective" (Jul 2024)
    url: https://press.spglobal.com/2024-07-18-United-States-Ranks-Next-to-Last-in-Development-Time-for-New-Mines-that-Produce-Critical-Minerals-for-Energy-Transition,-S-P-Global-Finds
    slide: Old Mills, Fast x Fast

  - claim: Mass-timber projects run 20-30% faster construction schedules than steel and concrete
    provenance: triangulated
    source: ULI Urban Land; case-study reviews (avg ~20% across seven case studies, 12.7 vs 15.4 months; other studies up to 25-30%)
    url: https://urbanland.uli.org/development-business/faster-project-delivery-hidden-features-sustainable-mass-timber
    slide: Fast x Fast
    note: Range spans studies; 40% claims exist but are not used. SUPERWOOD analogized to mass timber (prefab, light, timber detailing).

  - claim: Excess capacity exists in US sawmills
    provenance: asserted-internal
    source: Alex Lau, 2026-08-23 (industry knowledge)
    slide: Fast x Fast
    note: Not yet externally sourced. Plausible given 2023-2025 sawmill curtailments on weak housing demand, but find a utilization figure before print use.

  - claim: ~60% of a US data center is steel; operators concerned about structural steel shortage
    provenance: inherited
    source: ../../investor-overview/sources/claims.yaml
    slide: The Gap

  - claim: Hybrid SUPERWOOD-glulam beams (SUPERWOOD outer laminations, ~10% of section) increase bending stiffness ~75% and bending strength ~100%
    provenance: inherited
    source: ../../investor-overview/slides.html Hybrid Beams appendix / parent claims register
    slide: Demand (path-to-structural strip)

  - claim: Structural application engineering underway with Fast + Epp and Don Davies
    provenance: asserted-internal
    source: Alex Lau, 2026-08-23
    slide: Demand (path-to-structural strip)
    note: Davies is a deck advisor (fmr. President, Magnusson Klemencic). Confirm Fast + Epp engagement is public/citable before wide distribution.

  # Economics comparison table (Economics slide)
  - claim: Steel minimill (EAF sheet) - build 2.5-2.75 yr (Apple Grove stretching to 5.5-6), capex $1.9-4.0B, ~3M t/yr, EBITDA 14-25% over cycle (SDI 2024/2021), capex 1.5-7.6x annual EBITDA across cycle
    provenance: published/derived
    source: ~/Git/mills/SUPERMILL economics/comparison.csv (compiled from published SDI/industry data)
    slide: Economics

  - claim: Minimill power ~150 MW class (EAF melt 350-500 kWh/t)
    provenance: derived
    source: melt intensity published (comparison.csv); site average derived for ~3M t/yr - melt only, total site higher
    slide: Economics
    note: Conservative direction (understates minimill power), so the contrast is safe.

  - claim: Aluminum smelter ~17% EBITDA margin in a record year; capex ~13x annual EBITDA at 2025 margins
    provenance: derived
    source: Century Aluminum FY2025 results - net sales $2.5B, adj EBITDA $425M; Inola capex ~$4B, 750K t/yr
    url: https://centuryaluminum.com/investors/press-releases/press-release-details/2026/Century-Aluminum-Company-Reports-Fourth-Quarter-2025-Results/default.aspx
    slide: Economics
    note: 2025 was tariff-supported; historical margins lower, hence "record year" qualifier.

  - claim: SUPERMILL power MW-class, process heat self-fueled by wood residues
    provenance: internal
    source: FEL2 facility basis (~900-930 kWh/t electric + self-fueled boiler), via mills comparison.csv
    slide: Economics
    note: TEM-vs-FEL2 energy reconciliation open (5-7x gap); even at TEM basis still tens of MW - "MW-class" holds either way. Do not print a specific MW number until reconciled.

  - claim: SUPERMILL capex ~1.4x annual EBITDA
    provenance: derived
    source: $300M capex / (65% of $320M projected revenue = $208M EBITDA)
    slide: Economics
