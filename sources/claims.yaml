    note: >-
      TRACED 2026-08-27. Origin is ../superwood-datacenter slide 16 ("About 60% of the mass
      of a typical US data center is steel"), where reviews/REVIEW-2026-07-24.md flagged it
      three times as unsourced and "almost certainly wrong" ON THE ALL-IN MASS BASIS
