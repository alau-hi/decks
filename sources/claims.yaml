  - claim: The US is a net EXPORTER of iron ore - imports are ~11% of apparent consumption
    provenance: published
    conf: H
    source: >-
      USGS Mineral Commodity Summaries 2026 - Iron Ore (2025e): imports for consumption
      4.0 Mt, exports 7.8 Mt, apparent consumption 37.0 Mt, domestic production 38.0 Mt
      from eight open-pit mines in Michigan, Minnesota and Utah. Net import reliance is
      printed as "E" - net exporter. Import sources 2021-24: Brazil 58%, Canada 21%,
      Sweden 10%, Chile 4%.
    url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-iron-ore.pdf
    local: sources/mcs2026-ironore.pdf
    slide: none - register only (asked by Alex 2026-08-26)
    note: >-
