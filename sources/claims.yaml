      et al. 2022 and Sharma et al. 2023 [preprint, secondary citations, conf M]. A
      "~250 t/MW" figure circulates in trade press with no traceable origin [conf L,
      do not print]. Until the ex-concrete share is either sourced or derived bottom-up
      with stated assumptions, print it as Alex-asserted or not at all.

