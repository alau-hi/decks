  # Materials-gap background notes (2026-08-26, per Alex) - researched for the
  # reference document; NOT printed on a slide yet.
  - claim: ">95% of US titanium sponge consumption is met by imports (net import reliance); record ~42,000 t imported 2023, Japan 77-86% leading source; majority of US titanium metal use is aerospace"
    provenance: published
    conf: H
    source: USGS Mineral Commodity Summaries, January 2024, Titanium and Titanium Dioxide - net import reliance >95% of apparent consumption 2021-2023e (>50% in 2019-20); only active US sponge plant is electronic-grade, ~500 t/yr capacity (Salt Lake City); Henderson NV (12,600 t/yr) idled since 2020. https://pubs.usgs.gov/periodicals/mcs2024/mcs2024-titanium.pdf
    slide: The Gap (stat row + gnote, added 2026-08-26)
  - claim: "US imports roughly 30,000 t/yr of carbon fiber - ~40% of ~75,000 t consumption - concentrated in intermediate/high-modulus aerospace grades from Japan"
    provenance: triangulated
    conf: M (volumes), M-H (aerospace-grade dependency direction)
    source: ORNL/NREL "Global Carbon Fiber Composites Supply Chain Competitiveness Analysis" (Das et al., May 2016; sources/Pub61706.pdf, supplied by Alex) - USITC trade data show imports met 66-86% of North American (mostly US) carbon fiber demand 2008-2012; Japan 43% + Europe 38% of 2012 US imports; report cautions the HTS code bundles CF with intermediates so the import share is likely overstated; aerospace-grade small-tow CF manufacturing "most concentrated in Japan" (top three firms headquartered there), Toray dominant incl. the $6B Boeing 787 prepreg contract. Astute Analytica market report (~30 kt imports, ~40% of consumption, current-era but non-primary); Lexington Institute (Grant, Apr 2025) - outside Hexcel, "most of the remaining critical aerospace carbon fiber market is served by Japanese firms"; Nandina REM (Oct 2025, supplied by Alex) - defense reliance on Japanese/European proprietary fibers, GAO visibility gap. https://www.nandinarem.com/post/carbon-fibre-a-core-us-defence-supply-chain-vulnerability
    slide: The Gap (gnote - qualitative direction only, "aerospace-grade carbon fiber leans on Japanese suppliers"; no volumes printed)
    note: The ORNL/NREL report is government-grade provenance but 2012-vintage data; the ~30 kt / ~40% figures are current-era but market-research grade. Printable now: "imports have historically met a majority of US carbon fiber demand (66-86%, 2008-12)" [conf: H for the period stated] and the aerospace-grade Japan concentration [conf: H]. A current-year import share still lacks a primary source.
  - claim: "US import dependence on minerals is rising: imports exceeded half of apparent consumption for 54 nonfuel mineral commodities in 2025 (100% reliant for 16), up from 46 (100% for 15) in 2024"
    provenance: published
    conf: H
    source: USGS Mineral Commodity Summaries 2026, p.11 (2025 data) and MCS 2025, p.10 (2024 data), quoted verbatim from both. Politico Pro / E&E News coverage (Feb 9, 2026, paywalled) supplied by Alex reports the same release. https://pubs.usgs.gov/periodicals/mcs2026/mcs2026.pdf
    slide: The Gap (gnote, added 2026-08-26; all-nonfuel-commodities basis printed)
    note: On the Critical Minerals List basis the 2025 figures are 13 at 100% plus 20 more at >=50%; the 16/54 figures are the all-nonfuel-commodities basis. Use one basis consistently if printed.
