<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>InventWood Introduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f150c;--ink2:#2a1d11;
  --cream:#f4ecdf;--cream-dim:#cdbfa9;--muted:#9d8d76;
  --wood:#b87d44;--wood-bright:#cda165;--wood-deep:#8a4f23;
  --line:rgba(228,210,180,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:radial-gradient(120% 120% at 50% 0%,var(--ink2) 0%,var(--ink) 60%);color:var(--cream);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
.card{width:100%;max-width:320px}
.eyebrow{font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
h1{font-family:'Fraunces',serif;font-weight:400;letter-spacing:-.01em;line-height:1.05;font-size:clamp(2rem,5vw,2.6rem);margin-bottom:10px}
h1 em{font-style:italic;color:var(--wood-bright)}
.sub{font-size:.95rem;line-height:1.6;color:var(--cream-dim);font-weight:300;margin-bottom:34px}
label{display:block;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
input{width:100%;padding:13px 15px;margin-bottom:20px;background:rgba(244,236,223,.04);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-family:'Inter',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,background .2s}
input[hidden]{display:none}
input:focus{border-color:var(--wood);background:rgba(244,236,223,.07)}
input::placeholder{color:var(--muted);opacity:.6}
button{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--wood-deep),var(--wood));color:var(--cream);font-family:'Inter',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:filter .2s,opacity .2s;margin-top:4px}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.55;cursor:default}
.err{min-height:22px;font-size:.82rem;color:#d9906b;margin:14px 2px 0;opacity:0;transition:opacity .25s}
.err.show{opacity:1}
.foot{margin-top:44px;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>INVENTWOOD</h1>
  <p class="sub" id="sub">This presentation is shared privately. We appreciate you entering your email to continue.</p>
  <form id="f" novalidate>
    <input id="email" type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email">
    <input id="pw" type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" hidden>
    <button id="go" type="submit">View the deck</button>
    <div id="err" class="err"></div>
  </form>
</div>
<script>
// One screen for whatever the visitor still owes for the page they asked for.
// The middleware says which via a short-lived _swx cookie set on the rewrite
// that brought us here (bitmask: 1 = email, 2 = password); default is email.
const emailEl=document.getElementById('email'),pwEl=document.getElementById('pw'),sub=document.getElementById('sub');
let askEmail=true,askPw=false;
function applyMode(mask){
  mask=Number(mask)||0;
  if(!mask){location.reload();return;}
  askEmail=!!(mask&1); askPw=!!(mask&2);
  emailEl.hidden=!askEmail; pwEl.hidden=!askPw;
  sub.textContent='This presentation is shared privately. We appreciate you entering your '+(askEmail&&askPw?'email and password':askEmail?'email':'password')+' to continue.';
  (askEmail?emailEl:pwEl).focus();
}
const m=document.cookie.match(/(?:^|;\s*)_swx=([123])\b/);
document.cookie='_swx=; Max-Age=0; Path=/; Secure; SameSite=Lax';
if(m){applyMode(m[1]);}
else{
  // No hint (e.g. this page came from a cache): ask the server what is owed.
  applyMode(1);
  fetch('/api/enter?path='+encodeURIComponent(location.pathname),{cache:'no-store'}).then(r=>r.json()).then(d=>{ if(d&&typeof d.m==='number')applyMode(d.m); }).catch(()=>{});
}
// Watchman beacon: one fire per gate view, only when the visitor is still
// unidentified (a signed-in viewer asked for a deck password is not a bounce).
// JS-only (curl/crawlers never run it); skipped for declared automation;
// failure-silent everywhere.
try{
  if(askEmail&&!navigator.webdriver){
    const payload=JSON.stringify({path:location.pathname+location.search,scr:{w:innerWidth,h:innerHeight,sw:screen.width,sh:screen.height,dpr:devicePixelRatio,o:matchMedia('(orientation: portrait)').matches?'p':'l'}});
    if(!(navigator.sendBeacon&&navigator.sendBeacon('/api/gatehit',new Blob([payload],{type:'application/json'}))))
      fetch('/api/gatehit',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:payload}).catch(()=>{});
  }
}catch(_){}
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{
  e.preventDefault();
  err.classList.remove('show');
  const body={next:location.pathname};
  if(!emailEl.hidden){ body.email=emailEl.value.trim(); if(!body.email){err.textContent='Please enter your email.';err.classList.add('show');return;} }
  if(!pwEl.hidden){ body.password=pwEl.value; if(!body.password){err.textContent='Please enter the password.';err.classList.add('show');return;} }
  go.disabled=true;go.textContent='Checking…';
  try{
    const r=await fetch('/api/enter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.redirect){location.href=d.redirect;return;}
    // A stale mode hint (two tabs racing) can hide a field the server needs:
    // reveal it on the matching error instead of dead-ending the visitor.
    if(r.status===401&&pwEl.hidden){pwEl.hidden=false;sub.textContent='This presentation is shared privately. We appreciate you entering your '+(askEmail?'email and password':'password')+' to continue.';}
    if(r.status===400&&emailEl.hidden){emailEl.hidden=false;sub.textContent='This presentation is shared privately. We appreciate you entering your email and password to continue.';}
    err.textContent=d.error||'Something went wrong. Please try again.';
    err.classList.add('show');
  }catch(_){
    err.textContent='Network error. Please try again.';
    err.classList.add('show');
  }
  go.disabled=false;go.textContent='View the deck';
});
</script>
</body>
</html>
