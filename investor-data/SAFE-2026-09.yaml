# InventWood investor data — master register for the September 2026 SAFE round.
#
# ONE entry per FACT (not per slide, not per deck). Decks reference ids; they never
# redefine values. SAFE-2026-09.md and CONFLICTS.md are GENERATED from this file:
#     python build.py
# check_decks.py matches the per-deck registers back to these ids.
#
# Field notes
#   basis:      internal | published | derived | triangulated | estimated |
#               asserted-internal | unverified   (labels copied from the source registers;
#               never upgraded here)
#   confidence: H | M | L  (source labels such as "M-H" or "H (internal canonical)" are
#               kept verbatim in confidence_label and mapped to the LOWER letter)
#   status:     canonical | superseded | retired | open   (open = value not yet decided)
#   printed_in: decks that print the fact, from the source registers' slide fields.
#               Inherited facts the super-mills-america register says it traces to the
#               parent (capex, EBITDA, ROE, deposits, pipeline, cost roadmap, properties,
#               feedstock) list both decks.
#   slides:     optional {deck: [slide nav names]} for tracing
#   conflicts_with / conflict_topic / decision: drive CONFLICTS.md

meta:
  deck_names:
    super-mills-america: "SUPERMILLS Investor Overview (official name, Alex 2026-09-04; formerly 'Super Mills America'; deployed under superwood-presentation/supermills-america-overview)"
    superwood-datacenter-investor: "SUPERWOOD for Data Centers - InventWood investor companion to the SUPERMILLS Investor Overview"
    investor-overview: "InventWood Investor Overview (Canva, August 2026)"
  round: SAFE
  round_period: September 2026
  as_of: 2026-09-04
  maintainers:
    - Alex Lau (decisions; every canonical value is his call)
    - Claude (assembly and generation, 2026-09-04)
  authority: >-
    This YAML is the single source of truth. SAFE-2026-09.md and CONFLICTS.md are generated
    from it and must not be hand-edited.
  regenerate: >-
    cd /Users/test/Git/decks/investor-data && python build.py && python check_decks.py
  sources:
    - ../investor-overview/sources/claims.yaml (by slide; last_reconciled 2026-08-24)
    - ../super-mills-america/sources/claims.yaml (flat; edited to 2026-09-04)
    - ../investor-overview/sources/notes/superwood-unit-economics.md
    - ../investor-overview/sources/notes/steel-and-stainless-prices.md
    - ../investor-overview/sources/notes/steel-and-concrete-market-size.md
    - ../superwood-datacenter-investor/reviews/FRESH-LOOK-2026-09-04.md
    - ../superwood-datacenter-investor/analyses/materials-mass-and-replacement.md
  decks:
    investor-overview: Canva/HTML Investor Overview, August 2026 (41 slides)
    super-mills-america: Super Mills America deck
    superwood-datacenter-investor: SUPERWOOD for Data Centers, investor companion (rebuild pending Alex OK)
    aaron-deck: parent deck named in the SMA register as still printing 800+ deposits
  groups: [company, team, ip, mills, cost_price, economics, material, process, carbon,
           market, feedstock, customers, datacenter, financing, advisors, collaborators, comparison]

